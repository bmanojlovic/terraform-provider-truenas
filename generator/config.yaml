# TrueNAS Provider Generation Config

# Resources: auto-detected from *.create pattern
resources:
  auto_detect: true
  exclude: []
  
  # Resource-specific delete options
  delete_options:
    vm:
      force: true
      zvols: true
    vm.device:
      zvol: true

  # Field mapping: when API response uses a different field name than the TF attribute.
  # Format: resource_api_name: { tf_attribute: api_response_field }
  # Used during Read/readback to populate TF state from the correct API field.
  field_mapping:
    pool.snapshot:
      name: snapshot_name
      dataset: dataset

# Datasources: explicit list with get_instance support
datasources:
  - vm
  - pool
  - pool.dataset
  - disk
  - user
  - group
  - interface
  - service

# Query datasources: explicit list with query support  
query_datasources:
  # Core
  - vm
  - vm.device
  - pool
  - pool.dataset
  - pool.snapshot
  - pool.snapshottask
  - pool.scrub
  - disk
  - user
  - group
  - interface
  - service
  - staticroute
  # Apps & Containers
  - app
  - app.image
  - app.ix_volume
  - app.registry
  - virt.instance
  - virt.volume
  - docker.network
  # Sharing
  - sharing.nfs
  - sharing.smb
  # Backup & Replication
  - replication
  - cloudsync
  - cloudsync.credentials
  - cloud_backup
  - rsynctask
  - cronjob
  # Security & Auth
  - certificate
  - keychaincredential
  - privilege
  - api_key
  - acme.dns.authenticator
  - kerberos.keytab
  - kerberos.realm
  # Boot & System
  - boot.environment
  - dns
  - initshutdownscript
  - tunable
  - system.ntpserver
  - alertservice
  - reporting.exporters
  # iSCSI
  - iscsi.auth
  - iscsi.extent
  - iscsi.initiator
  - iscsi.portal
  - iscsi.target
  - iscsi.targetextent
  # NVMe-oF
  - nvmet.host
  - nvmet.host_subsys
  - nvmet.namespace
  - nvmet.port
  - nvmet.port_subsys
  - nvmet.subsys
  # Fibre Channel
  - fc.fc_host
  - fcport
  - jbof
  # VMware
  - vmware
  # Filesystem
  - filesystem.acltemplate

# Lookup datasources: methods that take a single string arg and return object data.
# Pattern: method(path_or_name) → {field: value, ...}
# Input field name is derived from the method's accepts schema.
lookup_datasources:
  - filesystem.stat
  - filesystem.statfs
  - filesystem.get_zfs_attributes

# Actions: job-based or keyword-matched methods
actions:
  keywords:
    - start
    - stop
    - restart
    - run
    - sync
    - scrub
    - backup
    - restore
    - rollback
    - redeploy
  
  # Explicit actions with metadata
  explicit:
    interface.commit:
      description: "Commit pending network changes. Starts rollback timer."
      workflow: |
        1. Make interface changes with truenas_interface
        2. Call commit (starts checkin_timeout rollback timer)
        3. Call checkin within timeout to confirm changes
      related:
        - interface.checkin
        - interface.rollback
      example: |
        resource "truenas_action_interface_commit" "apply" {
          depends_on       = [truenas_interface.vlan10]
          checkin_timeout  = 60
        }

    interface.checkin:
      description: "Confirm network changes work. Cancels rollback timer."
      depends_on: interface.commit
      workflow: |
        Must be called within checkin_timeout seconds after commit.
        If not called, changes auto-rollback.
      example: |
        resource "truenas_action_interface_checkin" "confirm" {
          depends_on = [truenas_action_interface_commit.apply]
        }

    interface.rollback:
      description: "Manually rollback pending network changes."

    filesystem.mkdir:
      description: "Create a directory on the filesystem."
      verify_with: filesystem.stat
      update:
        method: filesystem.setperm
        params:
          path: path
          mode: options_mode
      force_new:
        - path
      example: |
        resource "truenas_filesystem_mkdir" "data" {
          path         = "/mnt/tank/data"
          options_mode = "755"
        }

    boot.environment.activate:
      description: "Activate a boot environment for next reboot."
      example: |
        resource "truenas_action_boot_environment_activate" "switch" {
          boot_environment_activate = jsonencode({
            id = "24.10-MASTER-20241201-015106"
          })
        }

    boot.environment.clone:
      description: "Clone current boot environment."
      example: |
        resource "truenas_action_boot_environment_clone" "backup" {
          boot_environment_clone = jsonencode({
            id     = "24.10-MASTER-20241201-015106"
            target = "backup-before-upgrade"
          })
        }

    boot.environment.destroy:
      description: "Delete a boot environment."

    boot.environment.keep:
      description: "Mark boot environment to keep (prevent auto-pruning)."

    boot.detach:
      description: "Detach a disk from the boot pool."

    pool.snapshot.clone:
      description: "Clone a snapshot to a new dataset/zvol."
      example: |
        resource "truenas_action_pool_snapshot_clone" "clone" {
          snapshot    = "tank/source@snap1"
          dataset_dst = "tank/destination"
        }

    vm.clone:
      description: "Clone an existing VM."
      example: |
        resource "truenas_action_vm_clone" "copy" {
          id   = 1
          name = "cloned-vm"
        }

    vm.poweroff:
      description: "Force power off a VM."

    vm.suspend:
      description: "Suspend a running VM."

    vm.resume:
      description: "Resume a suspended VM."

    pool.upgrade:
      description: "Upgrade pool to latest ZFS features."

    pool.offline:
      description: "Take a pool disk offline."

    pool.online:
      description: "Bring a pool disk online."

    pool.detach:
      description: "Detach a disk from a pool."

    sharing.smb.setacl:
      description: "Set SMB share ACL entries to control user/group access."
      example: |
        resource "truenas_action_sharing_smb_setacl" "myshare" {
          smb_setacl = jsonencode({
            share_name = "myshare"
            share_acl  = [
              { ae_perm = "FULL", ae_type = "ALLOWED", ae_who_str = "myuser" }
            ]
          })
        }

# Singleton configs: services with only config/update (no create/delete)
singletons:
  nfs:
    read: nfs.config
    update: nfs.update
    description: "NFS service configuration"
  smb:
    read: smb.config
    update: smb.update
    description: "SMB service configuration"
  ftp:
    read: ftp.config
    update: ftp.update
    description: "FTP service configuration"
  ssh:
    read: ssh.config
    update: ssh.update
    description: "SSH service configuration"
  snmp:
    read: snmp.config
    update: snmp.update
    description: "SNMP service configuration"
  ups:
    read: ups.config
    update: ups.update
    description: "UPS service configuration"
  mail:
    read: mail.config
    update: mail.update
    description: "Mail/SMTP configuration"
  iscsi_global:
    read: iscsi.global.config
    update: iscsi.global.update
    description: "iSCSI global configuration"
  system_advanced:
    read: system.advanced.config
    update: system.advanced.update
    description: "System advanced settings"
  system_general:
    read: system.general.config
    update: system.general.update
    description: "System general settings"
  network_configuration:
    read: network.configuration.config
    update: network.configuration.update
    description: "Network configuration"

# Skip patterns: methods to ignore
skip:
  - "*.choices"
  - "*.choice"
  - "auth.*"
  - "core.ping"
  - "core.subscribe"
  - "core.unsubscribe"
